name: SKape OS backend

on:
  push:
  pull_request:

jobs:
  sqlite:
    name: SQLite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/SKape-os/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Import the application from runtime requirements
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: skape-test-jwt-signing-secret-value
          ALGORITHM: HS256
        run: python -c "import app.main"
      - name: Install test dependencies
        run: |
          python -m pip install \
            "pytest==9.1.1" \
            "httpx==0.28.1"
      - name: Run the SQLite suite
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: skape-test-jwt-signing-secret-value
          ALGORITHM: HS256
        run: python -m pytest -q

  postgres:
    name: PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/SKape-os/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skape_ci
          POSTGRES_PASSWORD: skape_ci
          POSTGRES_DB: skape_ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skape_ci -d skape_ci_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Import the application from runtime requirements
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: skape-test-jwt-signing-secret-value
          ALGORITHM: HS256
        run: python -c "import app.main"
      - name: Install test dependencies
        run: |
          python -m pip install \
            "pytest==9.1.1" \
            "httpx==0.28.1"
      - name: Run PostgreSQL API and integration tests
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: skape-test-jwt-signing-secret-value
          ALGORITHM: HS256
          SKAPE_TEST_DATABASE_URL: postgresql+psycopg2://skape_ci:skape_ci@localhost:5432/skape_ci_admin
          SKAPE_REQUIRE_POSTGRES: "1"
          SKAPE_TEST_POSTGRES_API: "1"
        run: |
          python -m pytest -q \
            tests/test_workflows.py \
            tests/test_hardening.py \
            tests/test_security_remediation.py \
            tests/test_comments.py \
            tests/test_tenant_security.py \
            tests/test_readiness_schema.py \
            tests/test_device_monitor_postgres.py \
            -k "not test_organization_active_migration_backfills_nulls and not test_email_uniqueness_migration_rejects_case_variants"
